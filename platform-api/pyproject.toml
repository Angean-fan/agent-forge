[project]
name = "agentforge-platform"
version = "0.1.0"
description = "AgentForge MVP 平台后端（Python / FastAPI / SQLAlchemy / SQLite）。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "deepagents>=0.7.24",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯例：Depends 等作为参数默认值是预期用法
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Path",
]
