[project]
name = "agentforge-platform"
version = "0.1.0"
description = "AgentForge MVP 平台后端（FastAPI 目标；M01 仅建立可重复测试基线）。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
