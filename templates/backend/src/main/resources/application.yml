# 默认配置：使用 MySQL（生产/compose）。所有敏感值仅从环境变量注入，无默认秘密。
server:
  port: 8080

spring:
  application:
    name: agentforge-template
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agentforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:agentforge}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      # 必须由部署环境提供；不得提交真实密钥
      secret: ${JWT_SECRET:}
      ttl-seconds: ${JWT_TTL_SECONDS:3600}
    admin:
      # 首次启动时用于初始化管理员账号；未配置则跳过初始化
      username: ${APP_ADMIN_USERNAME:}
      password: ${APP_ADMIN_PASSWORD:}
