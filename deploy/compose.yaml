# AgentForge 平台编排（API + worker + 维护任务 + UI + 持久化 SQLite 卷）。
#
# 这是**平台自身**的编排，与生成项目 ZIP 内的 compose.yaml（生成应用的 MySQL+后端+前端）
# 完全不同，勿混淆（见 docs/MVP_DEPLOY.md）。
#
# 独立 Runner **不在本文件内**：按隔离要求，Runner 运行在受控主机上（其自身需要 Docker），
# 平台不得为其挂载宿主 docker socket、平台数据库或 Provider 密钥。
#
# 用法：
#   cd deploy && cp .env.example .env   # 填 DEEPSEEK_API_KEY 与 RUNNER_*
#   docker compose up -d --build
name: agentforge-platform

x-platform-env: &platform-env
  AGENTFORGE_DATABASE_URL: sqlite+pysqlite:////db/agentforge.db
  AGENTFORGE_ACCOUNTS_FILE: /config/accounts.json
  RUNNER_WORK_ROOT: /runs

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn agentforge_platform.main:app --host 0.0.0.0 --port 8000"]
    env_file: [.env]
    environment:
      <<: *platform-env
      AGENTFORGE_COOKIE_SECURE: "0"
    volumes:
      - platform-db:/db
      - ../platform-api/config/accounts.json:/config/accounts.json:ro
      - ./var/runs:/runs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["python", "-m", "agentforge_platform.worker"]
    env_file: [.env]
    environment:
      <<: *platform-env
    volumes:
      - platform-db:/db
      - ./var/runs:/runs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  maintenance:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    # 定期清理过期会话（并可在同处扩展运行产物清理）
    command: ["sh", "-c", "while true; do python -m agentforge_platform.maintenance sessions purge; python -m agentforge_platform.maintenance runs cleanup; sleep 3600; done"]
    env_file: [.env]
    environment:
      <<: *platform-env
    volumes:
      - platform-db:/db
      - ./var/runs:/runs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: deploy/ui.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  platform-db:
