# A01：本地开发 / 开源启动的 PostgreSQL 16 独立编排示例。
#
# 安全要求：严禁在仓库中硬编码数据库密码，启动前必须通过环境变量或未入库的 deploy/.env
# 传入 POSTGRES_PASSWORD。
#
# 用法（若本机已通过 15432 端口转发连接云服务器 PG，则无需启动本容器，直接在 platform-api/.env 配置 15432 即可）：
#   export POSTGRES_PASSWORD="<your_local_password>"
#   docker compose -f deploy/compose.local-pg.yaml up -d
#   export AGENTFORGE_DATABASE_URL="postgresql+psycopg://agentforge:${POSTGRES_PASSWORD}@127.0.0.1:5432/agentforge"
name: agentforge-local-pg

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在环境变量或 deploy/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentforge-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agentforge} -d $${POSTGRES_DB:-agentforge}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  agentforge-pg-data:
