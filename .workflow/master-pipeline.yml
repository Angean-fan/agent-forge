# AgentForge 平台基础回归门禁（Gitee Go 流水线）。
#
# 注意：本文件依据 Gitee Go 公开文档的 .workflow/*.yml 结构编写。字段名/步骤类型
# 在不同 Gitee Go 版本间存在差异，且本仓库尚未实际启用 Gitee Go，因此**尚未在本仓库
# 的执行环境中验证**。首次启用 Gitee Go 时，请以 Gitee 实际生成的 .workflow 默认文件
# 为准核对并调整，跑通后才能声称自动门禁生效（见 docs/M08A_回归门禁记录.md）。
#
# 本地等价实现：scripts/ci_gate.sh（已实测通过）。
version: '1.0'
name: master-pipeline
displayName: AgentForge 平台基础门禁

triggers:
  trigger: auto
  push:
    branches:
      include:
        - master

stages:
  - name: platform-gate
    displayName: 平台基础门禁
    trigger: auto
    strategy: naturally
    steps:
      - step: build@python
        name: platform-api-gate
        displayName: 平台 API pytest / ruff
        pythonVersion: '3.12'
        commands:
          - pip install uv
          - cd platform-api && uv run --locked pytest
          - cd platform-api && uv run --locked ruff check .
      - step: build@nodejs
        name: platform-ui-gate
        displayName: 平台 UI 安装/类型检查/构建/测试
        nodeVersion: '22'
        commands:
          - cd platform-ui && npm ci
          - cd platform-ui && npm run type-check
          - cd platform-ui && npm run build
          - cd platform-ui && npm test
